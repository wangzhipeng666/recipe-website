<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts_local.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:768px; overflow:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.5) 0 26px, transparent 27px),
      radial-gradient(circle at 85% 85%, rgba(255,255,255,.4) 0 34px, transparent 35px),
      radial-gradient(rgba(210,190,150,.38) 1.2px, transparent 1.3px),
      radial-gradient(rgba(210,190,150,.28) 1.2px, transparent 1.3px),
      #FAF2E0;
    background-size: auto, auto, 26px 26px, 34px 34px, auto;
    background-position: 0 0, 0 0, 0 0, 13px 17px, 0 0; }
  .card { position:relative; width:1024px; height:768px; padding:22px 26px;
    font-family:"ZCOOL KuaiLe","Hiragino Sans GB",sans-serif; color:#4A322A;
    display:flex; flex-direction:column; }
  .frame { position:absolute; inset:12px; border:2.5px dashed rgba(200,69,44,.42);
    border-radius:22px; pointer-events:none; }
  .topzone { display:flex; gap:20px; align-items:stretch; }
  .leftzone { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
  .rightzone { width:312px; flex:none; display:flex; flex-direction:column; gap:14px;
    align-items:center; }
  .head { display:flex; align-items:center; gap:16px; }
  .titleblock { flex:1; min-width:0; }
  h1 { font-size:54px; line-height:1.05; letter-spacing:3px; font-weight:400; }
  .sub { display:flex; gap:10px; align-items:center; margin-top:8px; }
  .chip { display:flex; align-items:center; gap:5px; padding:3px 12px; border-radius:999px;
    font-size:16px; border:2px solid rgba(74,50,42,.35); background:rgba(255,251,240,.8); }
  .chip.hot { border-color:#C8452C; color:#C8452C; }
  .hero { position:relative; width:312px; flex:none; }
  .blob { position:absolute; inset:-15px; z-index:0; }
  .blob i { position:absolute; border-radius:50%; filter:blur(15px); }
  .heroframe { position:relative; z-index:1; background:#FFFBF0; border:3px solid #4A322A;
    border-radius:16px; padding:7px; box-shadow:3px 4px 0 rgba(74,50,42,.18);
    transform:rotate(.9deg); overflow:hidden; }
  .heroframe svg { width:100%; height:auto; display:block; }
  .tape { position:absolute; z-index:3; width:92px; height:24px; background:rgba(245,196,69,.72);
    border:1.5px dashed rgba(74,50,42,.4); top:-11px; left:20px; transform:rotate(-5deg); }
  .seal { position:absolute; z-index:3; right:-12px; bottom:-12px; width:74px; height:74px;
    border-radius:13px; background:#C8452C; color:#FFF6E8; display:flex; align-items:center;
    justify-content:center; font-size:40px; transform:rotate(-6deg);
    box-shadow:2px 3px 0 rgba(74,50,42,.25);
    outline:2px solid rgba(200,69,44,.35); outline-offset:3px; }
  .tipnote { position:relative; z-index:1; width:100%; background:rgba(245,196,69,.32);
    border:2px dashed rgba(200,69,44,.5); border-radius:12px; padding:8px 12px 10px;
    transform:rotate(-.7deg); }
  .tiphead { font-size:16px; color:#C8452C; margin-bottom:2px; }
  .tipbody { font-family:"Ma Shan Zheng","ZCOOL KuaiLe",serif; font-size:16px;
    line-height:1.36; color:#8A5A2B; }
  .sec { background:rgba(255,251,240,.86); border:2.5px solid rgba(74,50,42,.85);
    border-radius:16px; padding:10px 14px 12px; position:relative; overflow:hidden;
    flex:none; }
  .sec.stepsec { flex:1 1 0; min-height:0; display:flex; flex-direction:column;
    margin-top:12px; }
  .sectitle { display:flex; align-items:center; gap:9px; font-size:24px; color:#C8452C;
    margin-bottom:8px; }
  .sectitle .line { flex:1; height:3px; border-radius:2px;
    background:repeating-linear-gradient(90deg, rgba(200,69,44,.4) 0 12px, transparent 12px 18px); }
  .ings { display:flex; flex-wrap:wrap; gap:6px 8px; }
  .ing { display:flex; align-items:center; gap:5px; padding:3px 10px 3px 6px;
    background:#FFF; border:1.8px solid rgba(74,50,42,.8); border-radius:999px;
    font-size:14px; white-space:nowrap; }
  .ing svg { width:20px; height:20px; flex:none; }
  .ing span { min-width:0; }
  .steps { display:flex; flex-direction:column; gap:7px; }
  .step { display:flex; align-items:flex-start; gap:10px; min-height:0; }
  .step svg { width:24px; height:24px; flex:none; margin-top:3px; }
  .badge { flex:none; border-radius:50%; background:#F5C445; border:2.5px solid #4A322A;
    color:#4A322A; display:flex; align-items:center; justify-content:center; font-size:18px; margin-top:2px; }
  .stxt { font-size:15px; line-height:1.34; padding-top:4px; min-width:0; }
  .step.many .stxt { font-size:14px; line-height:1.3; padding-top:3px; }
  .step.lots .stxt { font-size:13px; line-height:1.26; padding-top:3px; }
  .step.tiny .stxt { font-size:12px; line-height:1.22; padding-top:2px; }
  .step.tiny svg { width:19px; height:19px; margin-top:2px; }
  .step.tiny { gap:7px; }
  .step.lots svg { width:21px; height:21px; margin-top:2px; }
  .step.lots { gap:8px; }
  .steps.tight { gap:5px; }
  .stepsec .steps { flex:1; justify-content:space-between; }
  .ing span{font-size:13.0px}
</style></head>

    <div class="steps"><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">1</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="10" width="18" height="9" rx="2" fill="#E8C98F" stroke="#4A322A" stroke-width="1.6"/><path d="M6 7l9-3 2 4-9 3-2-4Z" fill="#B9C4CE" stroke="#4A322A" stroke-width="1.6"/></svg><span class="stxt">杏鲍菇洗净切厚片（2-3毫米），水开后下锅烫两分钟</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">2</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="10" width="18" height="9" rx="2" fill="#E8C98F" stroke="#4A322A" stroke-width="1.6"/><path d="M6 7l9-3 2 4-9 3-2-4Z" fill="#B9C4CE" stroke="#4A322A" stroke-width="1.6"/></svg><span class="stxt">捞出过凉水，挤干多余水分。用竹签串好（竹签提前泡水）</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">3</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14.6 3.6L8 14h5l-2.4 6.4L18 9h-5l1.6-5.4Z" fill="#F2C94C" stroke="#4A322A" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="stxt">将生抽、蚝油、番茄酱、孜然粒、孜然粉、辣椒粉、花椒粉、花生油混合调成酱料</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">4</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" fill="#F2C98A" stroke="#4A322A" stroke-width="1.6"/></svg><span class="stxt">杏鲍菇串刷上酱料</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">5</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="9" width="18" height="7" rx="3.5" fill="#4A4441" stroke="#4A322A" stroke-width="1.6"/><path d="M7 20c1-1.6 2-1.6 2.6 0M12 20c1-1.6 2-1.6 2.6 0M17 20c1-1.6 2-1.6 2.6 0" stroke="#E8763A" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="9" cy="12.4" r="1.2" fill="#F2C94C"/><circle cx="14.6" cy="12.4" r="1.2" fill="#F2C94C"/></svg><span class="stxt">放入空气炸锅中180度烤6分钟，取出翻面</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">6</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="9" width="18" height="7" rx="3.5" fill="#4A4441" stroke="#4A322A" stroke-width="1.6"/><path d="M7 20c1-1.6 2-1.6 2.6 0M12 20c1-1.6 2-1.6 2.6 0M17 20c1-1.6 2-1.6 2.6 0" stroke="#E8763A" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="9" cy="12.4" r="1.2" fill="#F2C94C"/><circle cx="14.6" cy="12.4" r="1.2" fill="#F2C94C"/></svg><span class="stxt">翻面后再刷一层酱料，继续烤6分钟</span></div><div class="step "><div class="badge" style="width:34px;height:34px;font-size:18.700000000000003px">7</div><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14.6 3.6L8 14h5l-2.4 6.4L18 9h-5l1.6-5.4Z" fill="#F2C94C" stroke="#4A322A" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="stxt">出炉撒上白芝麻即可</span></div></div>
